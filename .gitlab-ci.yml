image: python:3.10

stages:
  - test

before_script:
  - python --version
  - pip install hatch

tests:
  stage: test
  script:
    - hatch test --cover
    - hatch env run -e hatch-test -- coverage xml
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml