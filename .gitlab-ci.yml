image: python:3.10

stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

before_script:
  - python --version
  - pip install hatch

tests:
  stage: test
  # tags: [docker]   # décommente si ton runner n'accepte pas les jobs sans tag
  script:
    - hatch test