name: CI

on:
  push:
    branches: ["**"]
    tags: ["*"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install hatch coverage
      - run: hatch test --cover
      - run: coverage xml
      - uses: coverallsapp/github-action@v2
        with:
          file: coverage.xml

  deploy-stable:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install hatch
      - run: hatch build -t wheel
      - run: echo "my-arithmetic-nathan deployment on stable servers"
      - run: ls dist/

  deploy-develop:
    needs: tests
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install hatch
      - run: hatch build -t wheel
      - run: echo "my-arithmetic-nathan deployment on develop servers"
      - run: ls dist/
